<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<style>
    body{
        background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('image.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        margin: 0;
    }

    .register-page{
        width:100%;
        height:100%;
        display:flex;
        justify-content:center;
        align-items:center;
        margin-top:75px;
    }

    .register-box{
        width:500px;
        background:rgba(20,20,20,.95);
        border-radius:20px;
        padding:40px;
        box-shadow:0 0 25px rgba(0,0,0,.6);
    }

    .register-logo{
        width:100px;
        display:block;
        margin:0 auto 20px;
    }

    .register-box h2{
        color:#1fffe1;
        font-size:38px;
        margin-bottom:10px;
    }

    .register-box p{
        color:#ccc;
        margin-bottom:30px;
    }

    .form-control{
        background:#2b2b2b;
        color:white;
        border:none;
        padding:15px;
    }

    .form-control::placeholder{
        color:#999;
    }

    .form-control:focus{
        background:#2b2b2b;
        color:white;
        border:1px solid #1fffe1;
        box-shadow:none;
    }

    .form-check-label{
        color:#ddd;
    }

    .btn-register{
        background:#1fffe1;
        color:#000;
        font-size:20px;
        font-weight:bold;
        padding:12px;
        transition:.3s;
    }

    .btn-register:hover{
        background:#17d4bf;
    }
</style>
<body>
    <header class="navbar">
        <div class="logo">
            <img src="logotesting.jpg" alt="logo">
        </div>

        <ul class="menu">
            <li><a href="index.html#about-us">HOME</a></li>
            <li><a href="NEWUPDATE.html">NEW UPDATE</a></li>
            <li><a href="index.html#technical-support">TECHNICAL SUPPORT</a></li>
            <li><a href="download.html#download">DOWNLOAD</a></li>
            <li><a href="donation.html#donation">DONATION</a></li>
        </ul>

        <div class="right">
            <a href="play.html#create-account" class="play-btn">
                Play Now
            </a>
        </div>
    </header>

    <div class="register-page">
        <div class="register-box">
            <div class="text-center">
                <img src="logo.png" class="register-logo" alt="Logo">
                <h2 id="create-account">Create Account</h2>
                <p class="text-light">
                    Register to join our GTA V Roleplay Server
                </p>
            </div>
            <form>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Username" id="Username">
                </div>

                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Email Address" id="email">
                </div>

                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Password">
                </div>

                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Confirm Password">
                </div>

                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Discord Username">
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="agree">
                        <span style="color: white;">I Accept the </span><span style="color: #1fffe1;">Terms and Conditions</span>
                </div>
                <hr style="border-color: #d3fff9; margin-bottom: 20px;">

                <span style="color: white;">Already have an Account? 
                    <a href="login.html#Login" style="color: #17d4bf; text-decoration: none;">Log In</a>
                </span><br><br>
                <button type="submit" class="btn btn-register w-100"onclick="name()">
                    REGISTER
                </button>
            </form>
        </div>
    </div>
    <script>

        document.querySelector("form").addEventListener("submit", function (event) {
            event.preventDefault();

            let username = document.getElementById("Username").value.trim();
            let email = document.getElementById("email").value.trim();

            let password = document.querySelectorAll('input[type="password"]')[0].value;
            let confirmPassword = document.querySelectorAll('input[type="password"]')[1].value;

            let discord = document.querySelectorAll('input[type="text"]')[1].value.trim();

            let agree = document.getElementById("agree").checked;

            if (username === "") {
                alert("Please input your username!");
            }
            else if (username.length < 2) {
                alert("Username must have at least 2 characters!");
            }
            else if (!/^[a-zA-Z]+$/.test(username)) {
                alert("Username must contain letters only!");
            }

            else if (email === "") {
                alert("Please input your email!");
            }
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert("Please enter a valid email address!");
            }

            else if (password === "") {
                alert("Please input your password!");
            }
            else if (password.length < 8) {
                alert("Password must have at least 8 characters!");
            }

            else if (confirmPassword === "") {
                alert("Please confirm your password!");
            }
            else if (password !== confirmPassword) {
                alert("Passwords do not match!");
            }

            else if (discord === "") {
                alert("Please input your Discord username!");
            }

            else if (!agree) {
                alert("Please accept the Terms and Conditions!");
            }

            else {
                alert("Registration Successful!");

                document.querySelector("form").reset();
            }
        });

    </script>
    
</body>
</html>
